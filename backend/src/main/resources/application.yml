spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/assetpulse
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update        # use 'create' for first run, change to 'validate' after
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-that-is-at-least-256-bits-long-for-hmac}
    expiration-ms: 86400000   # 24 hours

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG