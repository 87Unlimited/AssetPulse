spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/assetpulse
    username: ${DB_USERNAME:assetpulse_user}
    password: ${DB_PASSWORD:assetpulse_pass}
  jpa:
    hibernate:
      ddl-auto: update        # 'update' preserves data, change to 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-that-is-at-least-256-bits-long-for-hmac}
    expiration-ms: 86400000   # 24 hours

server:
  port: 8080