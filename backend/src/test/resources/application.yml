spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/assetpulse
    username: ${DB_USERNAME:assetpulse_user}
    password: ${DB_PASSWORD:assetpulse_pass}
  jpa:
    hibernate:
      ddl-auto: update        # 'update' preserves data, change to 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: "a-safe-and-very-long-secret-key-specifically-for-junit-testing-123456"
    expiration-ms: 86400000   # 24 hours
  futu:
    host: ${FUTU_HOST:172.22.32.1}
    port: ${FUTU_PORT:11111}

server:
  port: 8080