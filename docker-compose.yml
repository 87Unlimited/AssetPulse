version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: assetpulse-db
    environment:
      POSTGRES_DB: assetpulse
      POSTGRES_USER: assetpulse_user
      POSTGRES_PASSWORD: assetpulse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: assetpulse-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@assetpulse.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: